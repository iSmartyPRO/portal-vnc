<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="920" height="470" rx="16" fill="#0d1117"/>
  <text x="460" y="42" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">PortalVNC — Architecture</text>
  <text x="460" y="66" text-anchor="middle" fill="#8b949e" font-size="13">Secure remote access to Windows · mutual TLS · admin-by-SID login</text>

  <!-- Clients -->
  <g>
    <rect x="40" y="110" width="220" height="90" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="150" y="140" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Browser (portal)</text>
    <text x="150" y="162" text-anchor="middle" fill="#8b949e" font-size="12">noVNC inside the</text>
    <text x="150" y="179" text-anchor="middle" fill="#8b949e" font-size="12">Remote Control module</text>
  </g>
  <g>
    <rect x="40" y="252" width="220" height="90" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="150" y="282" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Native viewer</text>
    <text x="150" y="304" text-anchor="middle" fill="#8b949e" font-size="12">Win32 executable,</text>
    <text x="150" y="321" text-anchor="middle" fill="#8b949e" font-size="12">our protocol only</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="340" y="110" width="200" height="90" rx="12" fill="#161b22" stroke="#1f6feb"/>
    <text x="440" y="140" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Gateway (Node)</text>
    <text x="440" y="162" text-anchor="middle" fill="#8b949e" font-size="12">WebSocket &#8596; mTLS,</text>
    <text x="440" y="179" text-anchor="middle" fill="#8b949e" font-size="12">RFB relay</text>
  </g>

  <!-- Agent -->
  <g>
    <rect x="650" y="150" width="230" height="212" rx="12" fill="#161b22" stroke="#238636"/>
    <text x="765" y="182" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Agent (service)</text>
    <line x1="672" y1="196" x2="858" y2="196" stroke="#30363d"/>
    <text x="672" y="220" fill="#adbac7" font-size="12.5">• screen capture (GDI)</text>
    <text x="672" y="242" fill="#adbac7" font-size="12.5">• keyboard / mouse input</text>
    <text x="672" y="264" fill="#adbac7" font-size="12.5">• Windows logon + SID 544</text>
    <text x="672" y="286" fill="#adbac7" font-size="12.5">• lock screen / UAC</text>
    <text x="672" y="308" fill="#adbac7" font-size="12.5">• multiple sessions</text>
    <text x="672" y="330" fill="#adbac7" font-size="12.5">• tray icon (optional)</text>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/></marker>
  </defs>
  <line x1="260" y1="155" x2="334" y2="155" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <text x="297" y="146" text-anchor="middle" fill="#8b949e" font-size="11">wss</text>
  <line x1="540" y1="165" x2="644" y2="210" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <text x="596" y="178" text-anchor="middle" fill="#8b949e" font-size="11">mTLS</text>
  <path d="M260 297 C 460 297, 470 302, 644 290" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="322" text-anchor="middle" fill="#8b949e" font-size="11">mTLS + handshake (direct, bypasses the gateway)</text>

  <text x="460" y="428" text-anchor="middle" fill="#8b949e" font-size="12">Port 7654 · mutual certificate verification · stock VNC clients cannot connect</text>
</svg>
