<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortalVNC — браузерный просмотрщик</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 8px 12px; background: #1b1b1b; display: flex; gap: 8px; align-items: center; }
  header input { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; }
  header button { padding: 4px 10px; border-radius: 4px; border: 0; background: #2d6cdf; color: #fff; cursor: pointer; }
  #status { margin-left: auto; opacity: .8; }
  #screen { width: 100vw; height: calc(100vh - 41px); background: #000; }
</style>
</head>
<body>
  <header>
    <strong>PortalVNC</strong>
    <label>Шлюз: <input id="ws" size="26" value="ws://localhost:8787/ws" /></label>
    <label>Токен: <input id="token" size="14" value="dev" /></label>
    <button id="connect">Подключиться</button>
    <span id="status">не подключено</span>
  </header>
  <div id="screen"></div>
<script type="module">
  import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';
  const status = document.getElementById('status');
  let rfb = null;
  function connect() {
    if (rfb) { rfb.disconnect(); rfb = null; }
    const url = document.getElementById('ws').value + '?token=' + encodeURIComponent(document.getElementById('token').value);
    status.textContent = 'подключение…';
    rfb = new RFB(document.getElementById('screen'), url, {});
    rfb.scaleViewport = true;
    rfb.clipViewport = false;
    rfb.addEventListener('connect', () => { status.textContent = 'подключено'; });
    rfb.addEventListener('disconnect', (e) => {
      status.textContent = 'отключено' + (e.detail && e.detail.clean ? '' : ' (ошибка)');
    });
    rfb.addEventListener('securityfailure', (e) => { status.textContent = 'отказ: ' + (e.detail && e.detail.reason); });
  }
  document.getElementById('connect').addEventListener('click', connect);
</script>
</body>
</html>
